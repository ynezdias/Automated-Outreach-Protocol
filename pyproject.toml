[project]
name = "automated-outreach-protocol"
version = "0.1.0"
description = "Automated outreach protocol: AWS CDK infrastructure and Salesforce integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.59",
    "dnspython>=2.8.0",
    "phonenumbers>=9.0.35",
    "polars>=1.43.1",
    "rsa>=4.9.1",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.170",
    "constructs>=10.0",
    "detect-secrets>=1.5",
    "moto[s3]>=5.0 ; platform_machine != 'ARM64'",
    "mypy>=1.13",
    "nodejs-wheel-binaries>=24.16.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately contain ambiguous-unicode adversarial inputs (homoglyphs),
# and the guardrails confusables table is made of exactly those characters.
"tests/*" = ["RUF001"]
"src/guardrails/text.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["infra", "src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100"
